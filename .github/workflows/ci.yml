# Проверки на каждый push и merge request: линтер, типы, тесты на PostgreSQL, сборка образа и поиск уязвимостей.
# На тег v* образ публикуется в GitHub Container Registry.
name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: E2E (Playwright)
        run: npx playwright install --with-deps chromium && npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
      - name: Уязвимости в зависимостях (high и выше)
        run: npm audit --omit=dev --audit-level=high && npm --prefix web audit --omit=dev --audit-level=high

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образа
        run: docker build -t testball:ci .
      - name: Сканирование образа (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: testball:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Публикация по тегу
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}
          docker tag testball:ci "$IMAGE" && docker push "$IMAGE"
