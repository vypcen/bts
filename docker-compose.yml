services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Имена базы и пользователя остались от прежнего названия проекта. Не меняйте их:
      # PostgreSQL создаёт их только при первом запуске, и приложение потеряет доступ к уже созданной базе.
      POSTGRES_DB: testbed
      POSTGRES_USER: testbed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в файле .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testbed -d testbed"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Порт базы наружу не открыт: к ней обращается только приложение внутри Docker.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://testbed:${POSTGRES_PASSWORD}@db:5432/testbed
      PORT: 3000
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-}
      REGISTRATION: ${REGISTRATION:-open}
      SETUP_CODE: ${SETUP_CODE:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Локальная модель (необязательно). Пустой LLM_URL — функции с моделью выключены
      LLM_URL: ${LLM_URL:-}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-120000}
      # Запросов к модели на пользователя за 10 минут
      LLM_USER_LIMIT: ${LLM_USER_LIMIT:-20}
    # По умолчанию приложение доступно только с этого компьютера: снаружи — через туннель или прокси.
    # Для доступа из локальной сети (вариант А в README) задайте APP_BIND=0.0.0.0
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - ./import:/app/import:ro
      - uploads:/app/data/uploads

  # Доступ из интернета через Cloudflare Tunnel (необязательно).
  # Запускается только командой: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:2026.9.2
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app

  # Локальная языковая модель (необязательно).
  # Запускается только командой: docker compose --profile llm up -d
  # Приложение от неё не зависит: если модель выключена, кнопки с ней просто не работают.
  ollama:
    image: ollama/ollama:0.6.8
    profiles: ["llm"]
    restart: unless-stopped
    environment:
      # Один запрос за раз и одна модель в памяти — под небольшой сервер без видеокарты
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_CONTEXT_LENGTH: ${LLM_CONTEXT:-8192}
      # Сколько держать модель в памяти после последнего запроса
      OLLAMA_KEEP_ALIVE: ${LLM_KEEP_ALIVE:-30m}
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    # Порт наружу не открыт: к модели обращается только приложение внутри Docker.
    # Видеокарта NVIDIA (нужен NVIDIA Container Toolkit или Docker Desktop с WSL 2) — раскомментируйте:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Скачивает модель LLM_MODEL при первом запуске и завершается; при следующих запусках проверяет, что она на месте
  ollama-pull:
    image: ollama/ollama:0.6.8
    profiles: ["llm"]
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${LLM_MODEL:-qwen2.5:3b}"]

volumes:
  pgdata:
  uploads:
  ollama:
