<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Testbed QA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<style>
/* Layout: top bar + single content column (max 1100px); test cases as a dense table with side editor drawer */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --sunken:#eaeeec; --fg:#18201d; --muted:#5d6b66; --line:#d6ddda;
  --accent:#1f6f5c; --accent-fg:#ffffff; --accent-soft:#dcefe8;
  --crit:#b3261e; --crit-soft:#fbe4e2; --warn:#9a6200; --warn-soft:#fdf0d6; --ok:#2e7d32; --ok-soft:#e1f2e2; --info:#2f5aa8; --info-soft:#e2eafa; --neutral-soft:#e9ecea;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#18201d; --sunken:#1f2925; --fg:#e4ebe8; --muted:#94a39d; --line:#2c3833;
  --accent:#4fb596; --accent-fg:#0d1512; --accent-soft:#1d3a31;
  --crit:#f08a82; --crit-soft:#3d1f1d; --warn:#e3b35a; --warn-soft:#3a2d14; --ok:#7bc77f; --ok-soft:#1d3320; --info:#8eb0f0; --info-soft:#1d2a44; --neutral-soft:#262f2b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#18201d; --sunken:#1f2925; --fg:#e4ebe8; --muted:#94a39d; --line:#2c3833;
  --accent:#4fb596; --accent-fg:#0d1512; --accent-soft:#1d3a31;
  --crit:#f08a82; --crit-soft:#3d1f1d; --warn:#e3b35a; --warn-soft:#3a2d14; --ok:#7bc77f; --ok-soft:#1d3320; --info:#8eb0f0; --info-soft:#1d2a44; --neutral-soft:#262f2b; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:var(--r);cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.danger.solid{background:var(--crit);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunken)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 11px}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{resize:vertical;min-height:70px}
.err{color:var(--crit);font-size:13px;min-height:1em}

/* top bar */
.topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;cursor:pointer;background:none;border:0;padding:0}
.brand .mark{width:26px;height:26px;border-radius:5px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;min-width:0}
.crumbs b{color:var(--fg);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spacer{flex:1}
.user{font-size:13px;color:var(--muted)}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding-block:32px}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px;display:flex;flex-direction:column;gap:16px}
.tabs{display:flex;gap:4px;background:var(--sunken);padding:4px;border-radius:var(--r)}
.tabs button{flex:1;border:0;background:transparent;padding:7px;border-radius:4px;cursor:pointer;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hint{font-size:13px;background:var(--accent-soft);border-radius:var(--r);padding:10px 12px}

/* page */
main{padding-block:28px 60px;display:flex;flex-direction:column;gap:20px}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head h1{font-size:26px}
.head p{margin:4px 0 0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .input{width:auto;flex:1;min-width:180px}
.toolbar select.input{flex:0 0 auto}

/* projects */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.proj{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0}
.proj:hover{border-color:var(--accent)}
.proj .key{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:500}
.proj h3{font-size:17px}
.proj p{margin:0;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--sunken)}
.bar span{display:block}
.proj .meta{display:flex;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:36px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

/* summary */
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 12px;font-size:13px;cursor:pointer}
.stat[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.stat .n{font-family:var(--f-mono);font-weight:500}

/* table */
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:680px}
th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);background:var(--sunken)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--sunken)}
tbody tr:last-child td{border-bottom:0}
td.id{font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap}
td.title{font-weight:500}
td.actions{text-align:right;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.s-draft{background:var(--neutral-soft);color:var(--muted)}
.s-ready{background:var(--info-soft);color:var(--info)}
.s-passed{background:var(--ok-soft);color:var(--ok)}
.s-failed{background:var(--crit-soft);color:var(--crit)}
.s-blocked{background:var(--warn-soft);color:var(--warn)}
.prio{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.prio i{width:4px;height:14px;border-radius:2px;display:inline-block}
.p-critical i{background:var(--crit)} .p-high i{background:var(--warn)} .p-medium i{background:var(--info)} .p-low i{background:var(--line)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.4);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer header h2{font-size:18px;flex:1;min-width:0}
.drawer .body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.drawer footer{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.view-block{display:flex;flex-direction:column;gap:6px}
.view-block .txt{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sunken);border-radius:var(--r);padding:10px 12px;min-height:40px}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}

/* modal / confirm */
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:30;padding:16px}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;width:min(440px,100%);display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
.modal .box .acts{display:flex;justify-content:flex-end;gap:8px}

.ava{width:24px;height:24px;border-radius:50%;flex:0 0 auto;display:inline-grid;place-items:center;color:#fff;font-size:10px;font-weight:600;letter-spacing:.02em;line-height:1}
.ava.lg{width:56px;height:56px;font-size:20px}
.modal .scrim{z-index:0}
.who{display:inline-flex;align-items:center;gap:8px;min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:14px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ok)}
.live .dot{animation:none}
.skel{color:var(--muted);text-align:center;padding:48px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:14px;z-index:40}
@media (max-width:560px){.row2{grid-template-columns:1fr}.head h1{font-size:22px}.user{display:none}}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<script>
(function(){
const STATUSES=[["draft","Черновик"],["ready","Готов к прогону"],["passed","Пройден"],["failed","Упал"],["blocked","Заблокирован"]];
const PRIOS=[["critical","Критический"],["high","Высокий"],["medium","Средний"],["low","Низкий"]];
const SL=Object.fromEntries(STATUSES), PL=Object.fromEntries(PRIOS);

/* ---------- API ---------- */
let ME=null,liveErr="";
const canWrite=true;
const data={projects:[],cases:[],accounts:{},loadedP:false,loadedC:false};
class ApiError extends Error{constructor(status,msg){super(msg);this.status=status}}
async function api(method,url,body){
  let res;
  try{
    res=await fetch(url,{method,credentials:"same-origin",headers:body!==undefined?{"Content-Type":"application/json"}:{},body:body!==undefined?JSON.stringify(body):undefined});
  }catch(e){throw new ApiError(0,"Нет связи с сервером. Проверьте подключение и повторите попытку.")}
  let json={};try{json=await res.json()}catch(e){}
  if(!res.ok){
    if(res.status===401&&!url.startsWith("/api/auth/")){ME=null;S.view="login";render()}
    throw new ApiError(res.status,json.error||`Ошибка сервера (${res.status})`);
  }
  return json;
}
const casePath=id=>{const i=id.lastIndexOf("-");return `/api/projects/${encodeURIComponent(id.slice(0,i))}/cases/${encodeURIComponent(id.slice(i+1))}`};

async function loadState(){
  try{
    const st=await api("GET","/api/state");
    data.projects=st.projects;data.cases=st.cases;data.accounts=st.users;
    data.loadedP=data.loadedC=true;liveErr="";
    if(ME&&data.accounts[ME.id])ME.name=data.accounts[ME.id].name;
  }catch(e){if(e.status!==401)liveErr=e.message}
  render.noFocus=true;render();
}
let es=null,reloadTimer=null;
function startLive(){
  stopLive();
  try{
    es=new EventSource("/api/events");
    es.addEventListener("change",()=>{clearTimeout(reloadTimer);reloadTimer=setTimeout(loadState,150)});
    es.onopen=()=>{if(liveErr){liveErr="";loadState()}};
    es.onerror=()=>{liveErr="Связь с сервером прервана. Переподключаемся…";render.noFocus=true;render()};
  }catch(e){}
}
function stopLive(){if(es){es.close();es=null}}

/* ---------- state ---------- */
const S={view:"boot",authTab:"login",pid:null,q:"",fStatus:"all",fPrio:"all",drawer:null,confirm:null,busy:false};
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const proj=()=>data.projects.find(p=>p.id===S.pid);
const casesOf=pid=>data.cases.filter(c=>c.pid===pid);
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
const fmt=ts=>ts?new Date(ts).toLocaleString("ru-RU",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"—";
const statusPill=s=>`<span class="pill s-${s}"><span class="dot"></span>${SL[s]||s}</span>`;
const prioTag=p=>`<span class="prio p-${p}"><i></i>${PL[p]||p}</span>`;
const opts=(list,sel)=>list.map(([v,l])=>`<option value="${v}"${v===sel?" selected":""}>${l}</option>`).join("");
const nameOf=id=>{if(!id)return "—";if(ME&&id===ME.id)return "Вы";return (data.accounts[id]&&data.accounts[id].name)||"Участник"};
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const initials=n=>String(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?";
const avatar=(id,lg)=>{const n=(ME&&id===ME.id?ME.name:data.accounts[id]&&data.accounts[id].name)||id||"?";return `<span class="ava${lg?" lg":""}" style="background:hsl(${hue(id)} 45% 42%)" aria-hidden="true">${esc(initials(n))}</span>`};
const who=id=>id?`<span class="who">${avatar(id)}<span>${esc(nameOf(id))}</span></span>`:`<span class="muted">—</span>`;
function onData(){render.noFocus=true;render()}

async function write(fn,okMsg){
  if(S.busy)return false;
  S.busy=true;
  try{await fn();if(okMsg)toast(okMsg);await loadState();return true}
  catch(e){toast(e.message||"Не удалось сохранить");return false}
  finally{S.busy=false}
}

/* ---------- views ---------- */
function topbar(){
  const p=S.view==="project"?proj():null;
  return `<div class="topbar"><div class="wrap">
    <button class="brand" data-act="home"><span class="mark">TB</span>Testbed</button>
    <div class="crumbs">${p?`<span>/</span><button class="btn ghost" data-act="home" style="padding:4px 6px">Проекты</button><span>/</span><b>${esc(p.name)}</b>`:`<span>/</span><b>Проекты</b>`}</div>
    <div class="spacer"></div>
    <span class="live" title="Изменения других участников появляются автоматически"><span class="dot"></span>Онлайн</span>
    <span class="user who">${ME?avatar(ME.id):""}<span>${esc((ME&&ME.name)||"Вы")}</span><span class="mono" style="font-size:12px">@${esc(ME&&ME.id)}</span></span>
    <button class="btn" data-act="logout">Выйти</button>
  </div></div>`;
}
function bootView(){return `<div class="wrap login"><div class="skel">Подключаемся к базе…</div></div>`}
function noDbView(){
  return `<div class="wrap login"><div class="login-card">
    <span class="brand"><span class="mark">TB</span>Testbed</span>
    <h1 style="font-size:22px">Сервер недоступен</h1>
    <p class="muted" style="margin:0">Не удалось связаться с сервером Testbed. Проверьте, что он запущен, и обновите страницу.</p>
  </div></div>`;
}
function loginView(){
  const reg=S.authTab==="register";
  return `<div class="wrap login"><form class="login-card" id="authForm" novalidate>
    <span class="brand"><span class="mark">TB</span>Testbed</span>
    <div><h1 style="font-size:22px">${reg?"Создать аккаунт":"Вход в систему"}</h1><p class="muted" style="margin:4px 0 0">Тест-кейсы и прогоны для вашей команды</p></div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" aria-selected="${!reg}" data-act="tab-login">Вход</button>
      <button type="button" role="tab" aria-selected="${reg}" data-act="tab-register">Регистрация</button>
    </div>
    <div class="field"><label for="a-login">Логин</label><input class="input" id="a-login" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="anna.smirnova">${reg?`<span class="muted" style="font-size:12px">3–32 символа: латинские буквы, цифры, точка, дефис, подчёркивание</span>`:""}</div>
    ${reg?`<div class="field"><label for="a-name">Имя</label><input class="input" id="a-name" autocomplete="name" placeholder="Анна Смирнова"><span class="muted" style="font-size:12px">Его увидят коллеги в авторах тест-кейсов</span></div>`:""}
    <div class="field"><label for="a-pass">Пароль</label><input class="input" id="a-pass" type="password" autocomplete="${reg?"new-password":"current-password"}">${reg?`<span class="muted" style="font-size:12px">Минимум 8 символов</span>`:""}</div>
    ${reg?`<div class="field"><label for="a-pass2">Повторите пароль</label><input class="input" id="a-pass2" type="password" autocomplete="new-password"></div>`:""}
    <div class="err" id="a-err" role="alert"></div>
    <button class="btn primary" type="submit" style="justify-content:center;padding:10px">${S.busy?"Проверяем…":reg?"Зарегистрироваться":"Войти"}</button>
  </form></div>`;
}
function projectsView(){
  const list=[...data.projects].sort((a,b)=>(b.created||0)-(a.created||0));
  const card=p=>{
    const cs=casesOf(p.id),n=cs.length||1,cnt=k=>cs.filter(c=>c.status===k).length;
    const seg=(k,v)=>cnt(k)?`<span style="width:${cnt(k)/n*100}%;background:var(${v})"></span>`:"";
    return `<button class="proj" data-act="open" data-id="${esc(p.id)}">
      <span class="key">${esc(p.id)}</span><h3>${esc(p.name)}</h3>
      <p>${esc(p.desc)||"Без описания"}</p>
      <div class="bar" title="Статусы тест-кейсов">${seg("passed","--ok")}${seg("failed","--crit")}${seg("blocked","--warn")}${seg("ready","--info")}${seg("draft","--line")}</div>
      <div class="meta"><span>${cs.length} тест-кейсов</span><span>Пройдено: ${cnt("passed")}</span><span>Упало: ${cnt("failed")}</span></div>
      <div class="meta"><span>Создал: ${esc(nameOf(p.createdBy))}</span></div>
    </button>`;
  };
  const loading=!data.loadedP;
  return topbar()+`<main class="wrap">
    ${liveErr?`<div class="banner">${esc(liveErr)}</div>`:""}
    ${!canWrite?`<div class="banner">У вас доступ только на просмотр.</div>`:""}
    <div class="head"><div><h1>Проекты</h1><p class="muted">Общие для всех участников команды</p></div><div class="spacer"></div>
    ${canWrite?`<button class="btn primary" data-act="new-project">+ Новый проект</button>`:""}</div>
    ${loading?`<div class="skel">Загружаем проекты…</div>`:list.length?`<div class="grid">${list.map(card).join("")}</div>`:
    `<div class="empty"><b style="color:var(--fg)">Проектов пока нет</b>Создайте первый проект. Он сразу станет виден всем участникам.${canWrite?`<button class="btn primary" data-act="new-project">+ Новый проект</button>`:""}</div>`}
  </main>`+modal();
}
function projectView(){
  const p=proj();
  if(!p){S.view="projects";S.drawer=null;return projectsView()}
  const all=casesOf(p.id),q=S.q.trim().toLowerCase();
  const rows=all.filter(c=>(S.fStatus==="all"||c.status===S.fStatus)&&(S.fPrio==="all"||c.priority===S.fPrio)&&(!q||String(c.title).toLowerCase().includes(q)||(p.id+"-"+c.num).toLowerCase().includes(q))).sort((a,b)=>a.num-b.num);
  const stat=(k,l)=>`<button class="stat" aria-pressed="${S.fStatus===k}" data-act="fstat" data-k="${k}">${k==="all"?"":`<span class="pill s-${k}" style="padding:2px 4px"><span class="dot"></span></span>`}<span>${l}</span><span class="n">${k==="all"?all.length:all.filter(c=>c.status===k).length}</span></button>`;
  return topbar()+`<main class="wrap">
    ${liveErr?`<div class="banner">${esc(liveErr)}</div>`:""}
    ${!canWrite?`<div class="banner">У вас доступ только на просмотр.</div>`:""}
    <div class="head"><div><span class="label">${esc(p.id)}</span><h1>${esc(p.name)}</h1>${p.desc?`<p class="muted">${esc(p.desc)}</p>`:""}</div><div class="spacer"></div>
      ${canWrite?`<button class="btn" data-act="edit-project">Настройки проекта</button><button class="btn primary" data-act="new-case">+ Тест-кейс</button>`:""}</div>
    <div class="stats">${stat("all","Все")}${STATUSES.map(([k,l])=>stat(k,l)).join("")}</div>
    <div class="toolbar">
      <input class="input" id="q" type="search" placeholder="Поиск по названию или ID" value="${esc(S.q)}">
      <select class="input" id="fprio" aria-label="Приоритет"><option value="all">Любой приоритет</option>${opts(PRIOS,S.fPrio)}</select>
    </div>
    ${!data.loadedC?`<div class="skel">Загружаем тест-кейсы…</div>`:all.length===0?`<div class="empty"><b style="color:var(--fg)">В проекте нет тест-кейсов</b>Добавьте первый: название, шаги и ожидаемый результат.${canWrite?`<button class="btn primary" data-act="new-case">+ Тест-кейс</button>`:""}</div>`:
    `<div class="tbl-wrap"><table>
      <thead><tr><th style="width:90px">ID</th><th>Название</th><th style="width:130px">Приоритет</th><th style="width:160px">Статус</th><th style="width:170px">Автор</th><th style="width:120px">Обновлён</th>${canWrite?`<th style="width:96px"></th>`:""}</tr></thead>
      <tbody>${rows.map(c=>`<tr data-act="view-case" data-id="${esc(c.id)}">
        <td class="id">${esc(p.id)}-${c.num}</td><td class="title">${esc(c.title)}</td><td>${prioTag(c.priority)}</td><td>${statusPill(c.status)}</td>
        <td style="font-size:13px">${who(c.createdBy)}</td>
        <td class="muted" style="font-size:13px;white-space:nowrap">${fmt(c.updated)}</td>
        ${canWrite?`<td class="actions"><button class="btn ghost" data-act="edit-case" data-id="${esc(c.id)}" aria-label="Редактировать">✎</button><button class="btn ghost" data-act="del-case" data-id="${esc(c.id)}" aria-label="Удалить" style="color:var(--crit)">✕</button></td>`:""}
      </tr>`).join("")||`<tr><td colspan="7" class="muted" style="text-align:center;padding:28px;cursor:default">Ничего не найдено. Сбросьте фильтры или измените запрос.</td></tr>`}</tbody>
    </table></div>`}
  </main>`+drawer()+modal();
}
function drawer(){
  const d=S.drawer; if(!d)return "";
  const p=proj();
  if(d.mode==="view"){
    const c=data.cases.find(x=>x.id===d.id);
    if(!c){S.drawer=null;return ""}
    const steps=String(c.steps||"").split("\n").filter(Boolean);
    return `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-label="Тест-кейс">
      <header><span class="mono muted">${esc(p.id)}-${c.num}</span><h2>${esc(c.title)}</h2><button class="btn ghost" data-act="close" aria-label="Закрыть">✕</button></header>
      <div class="body">
        <div class="row2"><div class="view-block"><span class="label">Приоритет</span>${prioTag(c.priority)}</div>
        <div class="view-block"><span class="label">Статус</span>${canWrite?`<select class="input" id="quick-status">${opts(STATUSES,c.status)}</select>`:statusPill(c.status)}</div></div>
        <div class="view-block"><span class="label">Предусловия</span><div class="txt">${esc(c.pre)||"<span class='muted'>Не указаны</span>"}</div></div>
        <div class="view-block"><span class="label">Шаги</span><div class="txt">${steps.length?`<ol class="steps">${steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`:"<span class='muted'>Не указаны</span>"}</div></div>
        <div class="view-block"><span class="label">Ожидаемый результат</span><div class="txt">${esc(c.expected)||"<span class='muted'>Не указан</span>"}</div></div>
        <div class="row2" style="font-size:13px">
          <div class="view-block"><span class="label">Создал</span>${who(c.createdBy)}<span class="muted">${fmt(c.created)}</span></div>
          <div class="view-block"><span class="label">Изменил</span>${who(c.updatedBy)}<span class="muted">${fmt(c.updated)}</span></div>
        </div>
      </div>
      ${canWrite?`<footer><button class="btn primary" data-act="edit-case" data-id="${esc(c.id)}">Редактировать</button><div class="spacer"></div><button class="btn danger" data-act="del-case" data-id="${esc(c.id)}">Удалить</button></footer>`:""}
    </aside>`;
  }
  const c=d.id?data.cases.find(x=>x.id===d.id)||{}:{title:"",priority:"medium",status:"draft",pre:"",steps:"",expected:""};
  return `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-label="${d.id?"Редактирование":"Новый тест-кейс"}">
    <form id="caseForm" style="display:contents" novalidate>
    <header>${d.id?`<span class="mono muted">${esc(p.id)}-${c.num}</span>`:""}<h2>${d.id?"Редактирование":"Новый тест-кейс"}</h2><button type="button" class="btn ghost" data-act="close" aria-label="Закрыть">✕</button></header>
    <div class="body">
      <div class="field"><label for="c-title">Название *</label><input class="input" id="c-title" value="${esc(c.title)}" placeholder="Например: Вход с неверным паролем"></div>
      <div class="row2">
        <div class="field"><label for="c-prio">Приоритет</label><select class="input" id="c-prio">${opts(PRIOS,c.priority)}</select></div>
        <div class="field"><label for="c-status">Статус</label><select class="input" id="c-status">${opts(STATUSES,c.status)}</select></div>
      </div>
      <div class="field"><label for="c-pre">Предусловия</label><textarea class="input" id="c-pre" rows="2">${esc(c.pre)}</textarea></div>
      <div class="field"><label for="c-steps">Шаги</label><textarea class="input" id="c-steps" rows="5" placeholder="Каждый шаг с новой строки">${esc(c.steps)}</textarea></div>
      <div class="field"><label for="c-exp">Ожидаемый результат</label><textarea class="input" id="c-exp" rows="3">${esc(c.expected)}</textarea></div>
      <div class="err" id="c-err"></div>
    </div>
    <footer><button class="btn primary" type="submit">${d.id?"Сохранить":"Создать"}</button><button class="btn" type="button" data-act="close">Отмена</button></footer>
    </form>
  </aside>`;
}
function modal(){
  const m=S.confirm; if(!m)return "";
  if(m.type==="project"){
    const p=m.id?proj():{name:"",id:"",desc:""};
    const canDel=m.id&&(!p.createdBy||(ME&&p.createdBy===ME.id));
    return `<div class="modal"><div class="scrim" data-act="close-modal"></div><form class="box" id="projForm" novalidate>
      <h2 style="font-size:19px">${m.id?"Настройки проекта":"Новый проект"}</h2>
      <div class="field"><label for="p-name">Название *</label><input class="input" id="p-name" value="${esc(p.name)}" placeholder="Например: Личный кабинет"></div>
      <div class="field"><label for="p-key">Ключ для ID тест-кейсов</label><input class="input mono" id="p-key" value="${esc(p.id)}" maxlength="6" placeholder="LK" ${m.id?"disabled":""}><span class="muted" style="font-size:12px">${m.id?"Ключ нельзя изменить после создания":"2–6 латинских букв, например LK → LK-1, LK-2"}</span></div>
      <div class="field"><label for="p-desc">Описание</label><textarea class="input" id="p-desc" rows="2">${esc(p.desc)}</textarea></div>
      <div class="err" id="p-err"></div>
      <div class="acts">${canDel?`<button type="button" class="btn danger" data-act="del-project" style="margin-right:auto">Удалить проект</button>`:""}<button type="button" class="btn" data-act="close-modal">Отмена</button><button class="btn primary" type="submit">${m.id?"Сохранить":"Создать"}</button></div>
    </form></div>`;
  }
  return `<div class="modal"><div class="scrim" data-act="close-modal"></div><div class="box" role="alertdialog">
    <h2 style="font-size:19px">${esc(m.title)}</h2><p class="muted" style="margin:0">${esc(m.text)}</p>
    <div class="acts"><button class="btn" data-act="close-modal">Отмена</button><button class="btn danger solid" data-act="confirm-yes">Удалить</button></div>
  </div></div>`;
}

function render(){
  // keep a focused text field's value/caret across live re-renders
  const ae=document.activeElement,keep=ae&&ae.id&&app.contains(ae)&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)?{id:ae.id,s:ae.selectionStart,e:ae.selectionEnd}:null;
  const draft={};
  app.querySelectorAll("#caseForm .input, #projForm .input, #authForm .input").forEach(el=>draft[el.id]=el.value);
  if((S.view==="projects"||S.view==="project")&&!ME)S.view="login";
  const html=S.view==="boot"?bootView():S.view==="nodb"?noDbView():S.view==="login"?loginView():S.view==="projects"?projectsView():projectView();
  app.innerHTML=html;
  const sameForm=render.lastForm&&render.lastForm===formKey();
  if(sameForm)for(const id in draft){const el=document.getElementById(id);if(el)el.value=draft[id]}
  render.lastForm=formKey();
  if(keep){const el=document.getElementById(keep.id);if(el){el.focus();try{el.setSelectionRange(keep.s,keep.e)}catch(e){}}}
  else if(!render.noFocus){const f=app.querySelector(".drawer input, .modal input:not([disabled]), .modal .btn.danger.solid");if(f)f.focus()}
  render.noFocus=false;
}
const formKey=()=>S.view==="login"?"auth:"+S.authTab:S.drawer&&S.drawer.mode==="edit"?"case:"+(S.drawer.id||"new"):S.confirm&&S.confirm.type==="project"?"proj:"+(S.confirm.id||"new"):null;

/* ---------- events ---------- */
app.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]"); if(!t)return;
  const a=t.dataset.act,id=t.dataset.id;
  if(["edit-case","del-case"].includes(a))e.stopPropagation();
  switch(a){
    case "tab-login":S.authTab="login";break;
    case "tab-register":S.authTab="register";break;
    case "home":S.view="projects";S.pid=null;S.drawer=null;break;
    case "logout":api("POST","/api/auth/logout",{}).catch(()=>{});stopLive();S.view="login";S.authTab="login";S.pid=null;S.drawer=null;S.confirm=null;ME=null;toast("Вы вышли из системы");break;
    case "open":S.view="project";S.pid=id;S.q="";S.fStatus="all";S.fPrio="all";break;
    case "new-project":S.confirm={type:"project"};break;
    case "edit-project":S.confirm={type:"project",id:S.pid};break;
    case "del-project":{const p=proj();S.confirm={type:"del-project",title:`Удалить проект «${p.name}»?`,text:`Вместе с ним будут удалены ${casesOf(p.id).length} тест-кейсов у всех участников. Это действие нельзя отменить.`};break}
    case "close-modal":S.confirm=null;break;
    case "new-case":S.drawer={mode:"edit"};break;
    case "view-case":S.drawer={mode:"view",id};break;
    case "edit-case":S.drawer={mode:"edit",id};break;
    case "del-case":{const c=data.cases.find(x=>x.id===id);S.confirm={type:"del-case",id,title:`Удалить ${c.pid}-${c.num}?`,text:`Тест-кейс «${c.title}» будет удалён у всех участников без возможности восстановления.`};break}
    case "close":S.drawer=null;break;
    case "fstat":S.fStatus=t.dataset.k;break;
    case "confirm-yes":{
      const m=S.confirm;
      if(m.type==="del-case"){
        const ok=await write(()=>api("DELETE",casePath(m.id),{}),"Тест-кейс удалён");
        if(ok&&S.drawer&&S.drawer.id===m.id)S.drawer=null;
      }
      if(m.type==="del-project"){
        const pid=S.pid;
        const ok=await write(()=>api("DELETE","/api/projects/"+encodeURIComponent(pid),{}),"Проект удалён");
        if(ok){S.view="projects";S.pid=null}
      }
      S.confirm=null;break}
    default:return;
  }
  render();
});
app.addEventListener("input",e=>{
  if(e.target.id==="q"){S.q=e.target.value;render()}
});
app.addEventListener("change",async e=>{
  if(e.target.id==="fprio"){S.fPrio=e.target.value;render.noFocus=true;render()}
  if(e.target.id==="quick-status"){
    const cid=S.drawer.id,st=e.target.value;
    await write(()=>api("PATCH",casePath(cid),{status:st}),`Статус: ${SL[st]}`);
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(S.confirm||S.drawer)){if(S.confirm)S.confirm=null;else S.drawer=null;render.noFocus=true;render()}});
app.addEventListener("submit",async e=>{
  e.preventDefault();
  const v=id=>(document.getElementById(id)?.value||"").trim();
  if(e.target.id==="authForm"){
    if(S.busy)return;
    const errEl=document.getElementById("a-err"),err=t=>{errEl.textContent=t};
    const login=v("a-login").toLowerCase(),pass=document.getElementById("a-pass").value;
    if(!/^[a-z0-9._-]{3,32}$/.test(login)){err("Логин: 3–32 символа, латинские буквы, цифры, точка, дефис или подчёркивание");return}
    if(!pass){err("Введите пароль");return}
    const reg=S.authTab==="register";
    let name="";
    if(reg){
      name=v("a-name");
      if(!name){err("Укажите имя");return}
      if(pass.length<8){err("Пароль должен быть не короче 8 символов");return}
      if(pass!==document.getElementById("a-pass2").value){err("Пароли не совпадают");return}
    }
    S.busy=true;err("");
    const btn=e.target.querySelector("button[type=submit]");btn.disabled=true;btn.textContent="Проверяем…";
    try{
      const r=reg?await api("POST","/api/auth/register",{login,name,password:pass}):await api("POST","/api/auth/login",{login,password:pass});
      ME={id:r.user.login,name:r.user.name};
      if(reg)toast("Аккаунт создан");
    }catch(x){err(x.message);return}
    finally{S.busy=false;if(btn.isConnected){btn.disabled=false;btn.textContent=reg?"Зарегистрироваться":"Войти"}}
    S.view="projects";render();loadState();startLive();
    return;
  }
  if(e.target.id==="projForm"){
    const err=t=>{document.getElementById("p-err").textContent=t},name=v("p-name"),desc=v("p-desc");
    if(!name){err("Укажите название проекта");return}
    if(S.confirm.id){
      const pid=S.confirm.id;
      if(await write(()=>api("PATCH","/api/projects/"+encodeURIComponent(pid),{name,desc}),"Проект сохранён")){S.confirm=null;render()}
      return;
    }
    const key=v("p-key").toUpperCase();
    if(!/^[A-Z]{2,6}$/.test(key)){err("Ключ: от 2 до 6 латинских букв");return}
    if(data.projects.some(p=>p.id===key)){err(`Ключ ${key} уже занят другим проектом`);return}
    if(S.busy)return;S.busy=true;
    try{await api("POST","/api/projects",{key,name,desc})}
    catch(x){err(x.message);return}
    finally{S.busy=false}
    toast("Проект создан");
    S.confirm=null;S.view="project";S.pid=key;S.q="";S.fStatus="all";S.fPrio="all";
    await loadState();
  }
  if(e.target.id==="caseForm"){
    const title=v("c-title");
    if(!title){document.getElementById("c-err").textContent="Укажите название тест-кейса";return}
    const body={title,priority:v("c-prio"),status:v("c-status"),pre:v("c-pre"),steps:v("c-steps"),expected:v("c-exp")};
    if(S.drawer.id){
      const cid=S.drawer.id;
      if(await write(()=>api("PATCH",casePath(cid),body),"Изменения сохранены")){S.drawer={mode:"view",id:cid};render()}
      return;
    }
    let newId=null;
    const ok=await write(async()=>{newId=(await api("POST","/api/projects/"+encodeURIComponent(S.pid)+"/cases",body)).id});
    if(ok){toast(`Создан ${newId}`);S.drawer={mode:"view",id:newId};render()}
  }
});

/* ---------- boot ---------- */
render();
(async()=>{
  try{
    const r=await api("GET","/api/auth/me");
    if(r.user){ME={id:r.user.login,name:r.user.name};S.view="projects";render();await loadState();startLive();return}
    S.view="login";
  }catch(e){S.view="nodb"}
  render();
})();
})();
</script>
</body>
</html>
