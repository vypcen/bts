apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "testball.name" . }}
  labels: {{- include "testball.labels" . | nindent 4 }}
data:
  PORT: "3000"
  DB_POOL_SIZE: {{ .Values.database.poolSize | quote }}
  STORAGE: {{ .Values.storage.type | quote }}
  {{- if eq .Values.storage.type "s3" }}
  S3_ENDPOINT: {{ .Values.storage.s3.endpoint | quote }}
  S3_BUCKET: {{ .Values.storage.s3.bucket | quote }}
  S3_REGION: {{ .Values.storage.s3.region | quote }}
  S3_PREFIX: {{ .Values.storage.s3.prefix | quote }}
  S3_FORCE_PATH_STYLE: {{ .Values.storage.s3.forcePathStyle | quote }}
  {{- else }}
  UPLOAD_DIR: /app/data/uploads
  {{- end }}
  {{- range $k, $v := .Values.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "testball.dbSecretName" . }}
  labels: {{- include "testball.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "Задайте database.url или database.existingSecret" .Values.database.url | quote }}
---
{{- end }}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "testball.secretName" . }}
  labels: {{- include "testball.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_SECRET: {{ required "Задайте secrets.appSecret (длинная случайная строка)" .Values.secrets.appSecret | quote }}
  {{- with .Values.secrets.setupCode }}
  SETUP_CODE: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.licenseKey }}
  LICENSE_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.metricsToken }}
  METRICS_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.oidcClientSecret }}
  OIDC_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.ldapBindPassword }}
  LDAP_BIND_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.kerberosProxySecret }}
  KERBEROS_PROXY_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.s3AccessKey }}
  S3_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.s3SecretKey }}
  S3_SECRET_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
