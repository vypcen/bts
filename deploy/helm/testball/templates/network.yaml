apiVersion: v1
kind: Service
metadata:
  name: {{ include "testball.name" . }}
  labels: {{- include "testball.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "testball.selector" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "testball.name" . }}
  labels: {{- include "testball.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ include "testball.name" . }}, port: { name: http } }
{{- end }}
{{- if eq .Values.storage.type "local" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "testball.name" . }}-uploads
  labels: {{- include "testball.labels" . | nindent 4 }}
spec:
  accessModes: {{- toYaml .Values.storage.local.accessModes | nindent 4 }}
  {{- with .Values.storage.local.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests: { storage: {{ .Values.storage.local.size }} }
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "testball.name" . }}
  labels: {{- include "testball.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "testball.selector" . | nindent 6 }}
{{- end }}
